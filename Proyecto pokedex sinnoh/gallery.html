<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Galería - Pokédex de Sinnoh</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
  <header class="site-header">
    <a href="index.html" class="button-primary">← Back</a>
    <img src="images/logo-page.png" alt="logo" class="logo-image">
  </header>

  <main style="padding: 90px 16px 40px;">
    <h1>Galería de Sinnoh</h1>


    <section class="gallery-grid" aria-label="gallery">
      <div class="pokedex-list">

        <article class="pokemon-card">
          <img class="card-image" src="images/lago-valor.jpg" alt="Lake Valor" />
          <div class="card-body">
            <h4 class="card-title">Lago Valor</h4>
            <div class="card-meta">Lugar emblemático</div>
          </div>
        </article>

        <article class="pokemon-card">
          <img class="card-image" src="images/lago-veraz.jpg" alt="Empoleon close-up" />
          <div class="card-body">
            <h4 class="card-title">Lago Veraz</h4>
            <div class="card-meta">Lugar emblemático</div>
          </div>
        </article>

        <article class="pokemon-card">
          <img class="card-image" src="images/lago-agudeza.jpg" alt="Empoleon close-up" />
          <div class="card-body">
            <h4 class="card-title">Lago Agudeza</h4>
            <div class="card-meta">Lugar emblemático</div>
          </div>
        </article>


        <article class="pokemon-card">
          <img class="card-image" src="images/monte-corona.jpg" alt="Mt. Coronet" />
          <div class="card-body">
            <h4 class="card-title">Monte Corona</h4>
            <div class="card-meta">Lugar emblemático</div>
          </div>
        </article>

        <article class="pokemon-card">
          <img class="card-image" src="images/palkia-gallery.jpg" alt="Mt. Coronet" />
          <div class="card-body">
            <h4 class="card-title">Palkia</h4>
            <div class="card-meta">Deidad del espacio</div>
          </div>
        </article>

        <article class="pokemon-card">
          <img class="card-image" src="images/dialga-gallery.jpg" alt="Mt. Coronet" />
          <div class="card-body">
            <h4 class="card-title">Dialga</h4>
            <div class="card-meta">Deidad del tiempo</div>
          </div>
        </article>

        <article class="pokemon-card">
          <img class="card-image" src="images/giratina-gallery.jpg" alt="Mt. Coronet" />
          <div class="card-body">
            <h4 class="card-title">Giratina</h4>
            <div class="card-meta">???</div>
          </div>
        </article>

      </div>
    </section>
  </main>
  <footer class="site-footer">
    <p>© 2025 Pokédex de Sinnoh</p>
  </footer>
</body>

</html>
